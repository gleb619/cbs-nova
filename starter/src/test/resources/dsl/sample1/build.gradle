plugins {
  id 'java'
}

group = 'cbs.nova.dsl.sample1'
version = '1.0.0'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
}

configurations {
  dslRuntime
}

dependencies {
  implementation files('libs/dsl-api.jar')
  dslRuntime files('libs/dsl-api.jar', 'libs/dsl-codegen.jar')
  // DslCompiler transitively requires javaparser-core at runtime.
  dslRuntime 'com.github.javaparser:javaparser-core:3.28.1'
}

tasks.register('compileDsl', JavaExec) {
  classpath = configurations.dslRuntime
  mainClass = 'cbs.dsl.codegen.DslCompiler'
  args '.', 'build/dsl-classes'
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
  }
}