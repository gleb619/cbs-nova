plugins {
  id 'idea'
  alias(libs.plugins.spotless) apply false
  alias(libs.plugins.test.logger) apply false
}

apply from: "${rootDir}/../gradle/task-timer.gradle"
apply from: "${rootDir}/../gradle/worktree-version.gradle"

allprojects {
  group = 'cbs.nova'
  version = cbsNovaVersion
}

subprojects {
  apply plugin: 'maven-publish'
  apply from: "${rootDir}/../gradle/java.gradle"
  apply from: "${rootDir}/../gradle/test.gradle"
  apply from: "${rootDir}/../gradle/code-style.gradle"

  plugins.withType(JavaPlugin).configureEach {
    dependencies {
      compileOnly libs.lombok
      annotationProcessor libs.lombok

      testCompileOnly libs.lombok
      testAnnotationProcessor libs.lombok
    }
  }

  afterEvaluate {
    if (plugins.hasPlugin(JavaPlugin) && !plugins.hasPlugin('java-gradle-plugin')) {
      publishing {
        publications {
          mavenJava(MavenPublication) {
            from components.java
          }
        }
      }
    }
  }

  plugins.withId('io.spring.dependency-management') {
    tasks.withType(GenerateMavenPom).configureEach {
      notCompatibleWithConfigurationCache(
        'io.spring.dependency-management resolves managed dependency versions against Project at POM generation time')
    }
  }
}

idea {
  module {
    name = 'cbs-nova-dsl-plugins'
  }
}
