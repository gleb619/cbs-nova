server:
  port: 8091
  shutdown: graceful

spring:
  application:
    name: dsl-builder
  lifecycle:
    timeout-per-shutdown-phase: 30s

cbs:
  dsl:
    builder:
      workspace-dir: ${java.io.tmpdir}/dsl-builder
      cleanup-interval: PT10M
      session-ttl: PT1H
      dsl-version: 0.0.1-SNAPSHOT
      temporal-version: 1.27.0
      spring-boot-version: 4.0.4
      default-build-version: v1
      build-tasks:
        - clean
        - build
      source-folders:
        - dsl
        - models
      templates-dir: project/templates
      gradle-java-min: 8
      gradle-java-max: 25
      build-log-max-lines: 200
      jdk-search-paths:
        - ${user.home}/.sdkman/candidates/java
        - /usr/lib/jvm
      jdk-home-env-var: DSL_BUILDER_JAVA_HOME
      # Repo URL validation (SSRF guard) applied to a request-supplied repoUrl before cloning.
      # The operator-configured cbs.dsl.builder.git.repo-url is trusted and not validated.
      allowed-repo-schemes:
        - https
      allow-plain-http-repo: false
      allowed-repo-hosts: []
      queue:
        capacity: 100
        workers: 4
      drafts:
        history-limit: 20
      files:
        flush-interval-seconds: 5
        max-queue-size: 100
        read-bulkhead-permits: 32
        write-bulkhead-permits: 8
        acquire-timeout-seconds: 5
      git:
        enabled: true
        repository-dir: ${CBS_DSL_BUILDER_GIT_REPOSITORY_DIR:}
        worktrees-dir: ${CBS_DSL_BUILDER_GIT_WORKTREES_DIR:}
        repo-url: ${CBS_DSL_BUILDER_GIT_REPO_URL:}
        sub-path: ${CBS_DSL_BUILDER_GIT_SUB_PATH:}
        branch: ${CBS_DSL_BUILDER_GIT_BRANCH:}
        status-cache-ttl-seconds: 5
      file-buffer:
        max-entries: 1000
        expire-after-write-seconds: 3600