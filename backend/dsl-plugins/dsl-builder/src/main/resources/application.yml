server:
  port: 8091
  shutdown: graceful

spring:
  application:
    name: dsl-builder
  lifecycle:
    timeout-per-shutdown-phase: 30s

cbs:
  dsl:
    builder:
      workspace-dir: ${java.io.tmpdir}/dsl-builder
      cleanup-interval: PT10M
      session-ttl: PT1H
      dsl-version: 0.0.1-SNAPSHOT
      temporal-version: 1.27.0
      default-build-version: v1
      build-tasks:
        - clean
        - build
      source-folders:
        - dsl
        - models
      templates-dir: project/templates
      queue:
        capacity: 100
        workers: 4
      drafts:
        history-limit: 20
      files:
        flush-interval-seconds: 5
        max-queue-size: 100
        read-bulkhead-permits: 32
        write-bulkhead-permits: 8
        acquire-timeout-seconds: 5
      git:
        enabled: true
        status-cache-ttl-seconds: 5
      file-buffer:
        max-entries: 1000
        expire-after-write-seconds: 3600