plugins {
  id 'java-library'
  id 'maven-publish'
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dm)
}

bootJar {
  enabled = false
}

jar {
  enabled = true
}

dependencies {
  api project(":dsl-api")
  api project(':dsl')

  api libs.bundles.spring.web
  api libs.temporal.sdk

  api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
  api libs.sentry.spring.boot.jakarta

  annotationProcessor project(':dsl-codegen')
  annotationProcessor project(':misc-codegen')

  testImplementation libs.bundles.spring.test
  testImplementation libs.temporal.testing
  testImplementation project(':dsl-model')

  compileOnly 'org.springframework.boot:spring-boot-starter-actuator'
  testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
}
