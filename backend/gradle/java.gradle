import java.nio.file.Path
import java.util.regex.Pattern

apply plugin: 'java'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

abstract class FindLombokCandidatesTask extends DefaultTask {

  @InputFiles
  abstract ConfigurableFileCollection getSourceFiles()

  @Input
  abstract Property<String> getProjectRootPath()

  @TaskAction
  void performScan() {
    println "Scanning for boilerplate constructor candidates..."
    int candidateCount = 0

    Path rootPath = Path.of(getProjectRootPath().get())

    getSourceFiles().each { File srcFile ->
      String text = srcFile.text

      // Skip files that already use Lombok constructor annotations.
      if (text.contains('@RequiredArgsConstructor') || text.contains('@AllArgsConstructor')) {
        return
      }

      // Determine top-level type name and kind from the public class/record declaration.
      def typeMatcher = Pattern.compile(/public\s+(?:final\s+)?(class|record)\s+(\w+)/).matcher(text)
      if (!typeMatcher.find()) {
        return
      }
      boolean isRecord = typeMatcher.group(1) == 'record'
      String className = typeMatcher.group(2)

      if (isRecord) {
        // Records with a delegating overload this(...) are the junk constructors we can collapse
        // to a static factory once the canonical compact constructor is kept.
        def delegatingCtor = Pattern.compile(/(?s)public\s+/.concat(className).concat(/\s*\([^)]*\)\s*\{\s*this\s*\([^)]*\);\s*\}/)).matcher(text)
        if (delegatingCtor.find()) {
          def relativePath = rootPath.relativize(srcFile.toPath()).toString()
          println "Candidate found: ${relativePath}"
          candidateCount++
        }
        return
      }

      // Collect private final instance fields (exclude static by not matching it between).
      def finalFields = []
      def fieldMatcher = Pattern.compile(/(?m)^\s*private\s+final\s+([A-Za-z0-9_<>\[\].?, ]+)\s+([A-Za-z0-9_]+)\s*;/).matcher(text)
      while (fieldMatcher.find()) {
        finalFields << fieldMatcher.group(2)
      }

      if (finalFields.isEmpty()) return

      // 1. Canonical all-args constructor: assigns every collected final field, optional super(...) call first.
      StringBuilder canonicalPatternBuilder = new StringBuilder()
      canonicalPatternBuilder.append(/(?s)public\s+/).append(className).append(/\s*\([^)]*\)\s*\{/).append(/(?:\s*super\s*\([^)]*\)\s*;)?/)
      finalFields.each { fieldName ->
        canonicalPatternBuilder.append(/\s*(?:this\.)?/).append(fieldName).append(/\s*=\s*/).append(fieldName).append(/\s*;/)
      }
      canonicalPatternBuilder.append(/\s*\}/)
      boolean hasCanonicalCtor = Pattern.compile(canonicalPatternBuilder.toString()).matcher(text).find()

      // 2. Other junk constructors: any public ctor that delegates via this(...) or calls super(...).
      String junkCtorPattern = /(?s)public\s+/.concat(className).concat(/\s*\([^)]*\)\s*\{[^}]*\b(this|super)\s*\([^)]*\)[^}]*\}/)
      boolean hasJunkCtor = Pattern.compile(junkCtorPattern).matcher(text).find()

      if (hasCanonicalCtor || hasJunkCtor) {
        def relativePath = rootPath.relativize(srcFile.toPath()).toString()
        println "Candidate found: ${relativePath}"
        candidateCount++
      }
    }

    println "\nScan finished. Found ${candidateCount} file(s) ready for @RequiredArgsConstructor."
  }
}

tasks.register('findLombokCandidateConstructors', FindLombokCandidatesTask) {
  group = 'Verification'
  description = 'Lists files with boilerplate constructors that can be replaced with @RequiredArgsConstructor'

  def targetSrcDir = file("src/main/java")
  if (targetSrcDir.exists()) {
    sourceFiles.from(fileTree(targetSrcDir).include('**/*.java'))
  }

  projectRootPath.set(rootProject.projectDir.absolutePath)
}
