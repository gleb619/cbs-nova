import java.time.Duration
import java.time.Instant
import java.time.temporal.Temporal

// CAVEAT: when the Gradle configuration cache is active, task-graph hook output
// (including these [Task Timer] prints) may be suppressed and rely on stale runs.
// Use `--no-configuration-cache` to reliably observe per-task timings.

def taskStartTimes = [:]

gradle.taskGraph.beforeTask { Task task ->
  taskStartTimes[task.path] = Instant.now()
}

gradle.taskGraph.afterTask { Task task, TaskState state ->
  if (state.executed && taskStartTimes.containsKey(task.path)) {
    def startTime = taskStartTimes[task.path]
    def duration = Duration.between(startTime as Temporal, Instant.now())
    println "[Task Timer] ${task.path.padRight(40)} is finished in ${formatDuration(duration)}"
  }
}

static String formatDuration(Duration duration) {
  long minutes = duration.toMinutes()
  long seconds = duration.minusMinutes(minutes).getSeconds()
  long millis = duration.minusMinutes(minutes).minusSeconds(seconds).toMillis()

  if (minutes > 0) {
    return "${minutes}m ${seconds}s ${millis}ms"
  } else if (seconds > 0) {
    return "${seconds}s ${millis}ms"
  } else {
    return "${millis}ms"
  }
}
