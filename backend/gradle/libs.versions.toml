[versions]
java = "25"
jspecify = "1.0.1"
orgjson = "20260814"
junit = "6.1.3"
assertj = "3.27.7"
jqwik = "1.10.2"
temporal = "1.40.0"
javaparser = "3.28.2"
openfeign = "13.18"
wiremock = "3.13.2"
testcontainers = "1.21.4"
slf4j = "2.0.20"
mockito = "5.24.0"
awaitility = "4.3.0"
sentry = "8.64.0"
lombok = "1.18.48"
mapstruct = "1.6.3"
opentelemetry = "1.68.0"
# T842: matches the OTel 1.55.0 API used by libs.opentelemetry.*
opentelemetry-instrumentation-logback-appender = "2.33.1-alpha"
mvel = "2.6.0.Final"
keycloak-admin-client = "26.0.12"
rest-assured = "6.3.0"
springdoc-openapi = "3.2.0"
swagger-annotations = "2.2.55"
avaje-jsonb = "3.16"
avaje-jsonb-generator = "3.16"
h2 = "2.5.252"
caffeine = "3.3.1"
resilience4j = "2.4.0"
squigglesql = "4.2.1"
awssdk = "2.58.0"
nats = "2.26.4"

jgit = "7.8.1.202611041320-r"
jtokkit = "1.1.0"
junit4 = "4.13.2"
junit-vintage = "6.1.3"
gradle-tooling-api = "9.4.1"
flexmark = "0.64.8"

# plugins
spring-boot = "4.1.2"
spring-cloud = "2025.1.4"
spring-dm = "1.1.7"
spotless = "8.11.0"
spotbugs = "6.5.13"
sonarqube = "7.5.0.8588"
test-logger = "4.0.0"
gradle-git-properties = "4.0.1"
sentry-plugin = "6.26.0"

# supply-chain tooling (T414): pinned SBOM + CVE-scan plugins
cyclonedx-bom = "3.5.1"
dependency-check = "13.0.0"

[libraries]
# -- Resilience4j (T498) --
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-bulkhead = { module = "io.github.resilience4j:resilience4j-bulkhead", version.ref = "resilience4j" }

# -- Temporal --
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }

# -- Json --
avaje-jsonb = { module = "io.avaje:avaje-jsonb", version.ref = "avaje-jsonb" }
avaje-jsonb-generator = { module = "io.avaje:avaje-jsonb-generator", version.ref = "avaje-jsonb-generator" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }
jackson-databind3 = { module = "tools.jackson.core:jackson-databind", version = "3.3.0" }

# -- JTokkit (token counting for LLM/AI adapters in starter) --
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }

# -- Gradle Tooling API (used by dsl-builder to invoke gradle) --
gradle-tooling-api = { module = "org.gradle:gradle-tooling-api", version.ref = "gradle-tooling-api" }

# -- JUnit 4 + Vintage engine (IntelliJ Platform test framework requires legacy junit.framework.TestCase support) --
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-vintage" }

# -- JavaParser (used by dsl-codegen and dsl preprocessing) --
javaparser = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }

# -- OpenFeign --
openfeign-core = { module = "io.github.openfeign:feign-core", version.ref = "openfeign" }

# -- Testcontainers --
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq", version.ref = "testcontainers" }

# -- JUnit --
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# -- SLF4J --
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# -- Spring Boot --
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
# -- Mail (T769) --
# JavaMailSender lives in spring-context-support, but referencing the interface pulls jakarta.mail
# (for MimeMessage / MimeMessagePreparator signatures inherited from MailSender → JavaMailSender).
# Declared as compileOnly so apps that do not declare their own mail transport do not have mail
# jars on their runtime classpath; apps that want it declare spring-boot-starter-mail themselves
# and publish a JavaMailSender bean.
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }
swagger-annotations-jakarta = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-annotations" }

# -- AWS SDK v2 (T754) -- compileOnly for the opt-in `s3Storage` helper; users who do not
# declare software.amazon.awssdk:s3 themselves keep a starter without S3 on the classpath.
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
# T833: opt-in `natsPublish` helper. compileOnly keeps io.nats:jnats off every user's runtime
# classpath — apps that want the helper declare it themselves and expose a NATS Connection bean.
nats-client = { module = "io.nats:jnats", version.ref = "nats" }

# -- Misc --
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloak-admin-client" }
mvel2 = { module = "org.mvel:mvel2", version.ref = "mvel" }

# -- MapStruct --
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# -- OpenTelemetry --
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-logs = { module = "io.opentelemetry:opentelemetry-sdk-logs", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
opentelemetry-instrumentation-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-instrumentation-logback-appender" }
sentry-spring-boot-jakarta = { module = "io.sentry:sentry-spring-boot-4", version.ref = "sentry" }

# -- OTLP export wiring (T744) --
# No explicit versions: spring-boot-dependencies (applied by io.spring.dependency-management)
# manages micrometer-tracing 1.6.4, micrometer 1.16.4 and opentelemetry 1.55.0, so these track
# the Spring Boot BOM instead of drifting from it.
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
micrometer-registry-otlp = { module = "io.micrometer:micrometer-registry-otlp" }
spring-boot-opentelemetry = { module = "org.springframework.boot:spring-boot-opentelemetry" }
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }


# -- Databases --
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# -- Caffeine --
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }

# -- SquiggleSQL --
squigglesql = { module = "com.github.squigglesql:squigglesql", version.ref = "squigglesql" }

# -- YAML --
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.7" }

# -- Flexmark (YAML front-matter parser for explain markdown, T600) --
flexmark = { module = "com.vladsch.flexmark:flexmark", version.ref = "flexmark" }
flexmark-ext-yaml-front-matter = { module = "com.vladsch.flexmark:flexmark-ext-yaml-front-matter", version.ref = "flexmark" }

[bundles]
spring-web = ["spring-boot-starter-web", "spring-boot-starter-validation", "spring-boot-starter-actuator"]
spring-test = ["spring-boot-starter-test", "assertj"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dm = { id = "io.spring.dependency-management", version.ref = "spring-dm" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger" }
git-properties = { id = "com.gorylenko.gradle-git-properties", version.ref = "gradle-git-properties" }
sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentry-plugin" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx-bom" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
