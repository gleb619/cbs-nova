plugins {
  id 'java'
  alias(libs.plugins.spring.dm)
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
  }
}

dependencies {
  implementation project(':dsl-api')
  implementation project(':dsl')
  implementation project(':dsl-model')
  implementation libs.temporal.sdk
}

def generatedDir = layout.buildDirectory.dir('generated').get().asFile

sourceSets {
  main {
    java {
      srcDirs = [generatedDir]
    }
  }
}

configurations {
  dslCompiler
}

dependencies {
  dslCompiler project(':dsl-codegen')
  dslCompiler project(':dsl')
  dslCompiler project(':dsl-api')
  dslCompiler project(':dsl-model')
  dslCompiler project(':starter')
}

tasks.register('compileDsl', JavaExec) {
  group = 'build'
  description = 'Compiles DSL compact source files with DslCompiler'
  classpath = configurations.dslCompiler
  mainClass = 'cbs.nova.dsl.codegen.DslCompiler'
  args 'src', generatedDir.absolutePath
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
  }
  dependsOn ':starter:classes'
  doFirst {
    generatedDir.mkdirs()
  }
}

tasks.named('compileJava') {
  dependsOn 'compileDsl'
}

spotless {
  java {
    targetExclude 'build/generated/**/*.java'
  }
}
