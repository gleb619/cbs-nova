plugins {
  id 'java'
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dm)
  alias(libs.plugins.test.logger)
  // T414: apply OWASP dependency-check ONLY to the deployable launcher module.
  // This bounds the NVD scan to the Spring Boot runtime classpath that ships.
  // Pinned in backend/gradle/libs.versions.toml as `dependency-check`.
  alias(libs.plugins.dependency.check)
}

dependencies {
  implementation project(':starter')
  implementation project(':dsl-examples')
  implementation platform(libs.spring.cloud.dependencies)

  implementation libs.bundles.spring.web
  implementation libs.spring.boot.starter.actuator
  runtimeOnly libs.micrometer.registry.prometheus
  implementation libs.springdoc.openapi.starter.webmvc.ui
  implementation libs.openfeign.core
  // starter marks spring-boot-starter-amqp compileOnly (AmqpPublishHelper is optional-by-bean);
  // the deployable launcher must carry it so @SpringHelper instantiation finds AmqpTemplate classes
  implementation libs.spring.boot.starter.amqp
  // T754: same reason for S3StorageHelper (compileOnly in the starter) — without the SDK on the
  // launcher classpath @SpringHelper instantiation fails with NoClassDefFoundError: S3Client
  implementation libs.awssdk.s3
  // T739: KafkaPublishHelper is compileOnly in the starter; the launcher carries spring-kafka so
  // @SpringHelper instantiation finds KafkaTemplate classes. KafkaAutoConfiguration stays excluded
  // (application.yml), so no broker connection is made until a KafkaTemplate bean is published.
  implementation libs.spring.kafka
  // T769: NotificationRuleHandler/EmailRuleSink carry ObjectProvider<JavaMailSender> signatures;
  // the launcher must ship spring-context-support so generic type introspection finds the class.
  // SMTP stays inactive until spring.mail.host is set.
  implementation libs.spring.boot.starter.mail

  //T842 backend log pipeline ships through otel-collector logs exporter
  //OtlpLoggingConfiguration builds the SDK and invokes the appender install hook
  //logback-spring.xml declares the appender reference; installation is a no-op when no endpoint set
  //versions track the Spring Boot 4.0 BOM (opentelemetry 1.55.0)
  implementation libs.opentelemetry.sdk
  implementation libs.opentelemetry.sdk.logs
  implementation libs.opentelemetry.exporter.otlp
  implementation libs.opentelemetry.instrumentation.logback.appender

  testImplementation libs.bundles.spring.test
}

// T414: OWASP dependency-check configuration. Bound short timeouts so that
// when the NVD feed is unreachable from this environment, the gate degrades
// gracefully (see `make cve-scan`). Suppression file lives at
// `docs/security/cve-baseline.xml` (dependency-check native format).
dependencyCheck {
  suppressionFile = file("${rootDir}/../../../docs/security/cve-baseline.xml")
  failBuildOnCVSS = 7.0
  failOnError = false
  // Bound the NVD feed / NVD API endpoints to short timeouts so the gate
  // can fail-fast and degrade gracefully when the host cannot reach NIST.
  nvd {
    delay = 4000
    maxRetryCount = 1
    validForHours = 24
  }
  // Skip the analysis entirely if explicitly disabled (CI without network).
  skip = System.getenv('CBS_DEPENDENCY_CHECK_DISABLED') == 'true'
}
