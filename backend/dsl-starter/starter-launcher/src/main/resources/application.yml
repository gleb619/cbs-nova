spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  application:
    name: cbs-nova-example-starter

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nova}
    username: ${DATABASE_USERNAME:nova}
    password: ${DATABASE_PASSWORD:nova}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NovaHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 20000
      keepalive-time: 300000

  # Spring Data JDBC
  data:
    jdbc:
      repositories:
        enabled: true

  # Flyway schema migrations
  flyway:
    enabled: true
    locations: classpath:db/migration/${DATABASE_VENDOR:postgres}
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    out-of-order: false

  # JSON serialization
  jackson:
    default-property-inclusion: non_null

  # Kafka defaults
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

# HTTP server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/yaml
    min-response-size: 1024
  http2:
    enabled: true
  shutdown: graceful

# Temporal cluster connection
temporal:
  connection-target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}

# CBS Nova custom runtime settings
cbs:
  nova:
    logging:
      lifecycle: INFO    
      http: INFO       
      mdc-enabled: true 
    fakes:
      enabled: true
      config:
        entries:
          - type: helper
            code: httpCall
            response:
              status: 200
              body: "fake-http-body"
              headers: {}
              success: true
              error: null
          - type: helper
            code: unreliableApi
            response:
              attempts: 1
              status: "ok"
          - type: helper
            code: myCustomHelper
            response:
              value: "fake-value"
  # DSL authoring workbench
  dsl:
    git:
      enabled: true
      # repository-dir: # defaults to dsl.source-dir
    # Override with `CBS_DSL_SOURCE_DIR` env
    source-dir: ../dsl-examples

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: cbs.nova.starter.controllers

# Actuator + metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  info:
    env:
      enabled: false
    java:
      enabled: true
    git:
      enabled: true
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Sentry error tracking (only active when SENTRY_DSN is set)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: true
  logging:
    enabled: true
    minimum-event-level: warn
    minimum-breadcrumb-level: debug

# Logging
logging:
  level:
    root: INFO
    cbs.nova: INFO
    org.springframework.jdbc: WARN
    io.temporal: WARN
    org.apache.kafka: WARN
