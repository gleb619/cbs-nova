temporal:
  connection-target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}

cbs:
  nova:
    events:
      mq:
        enabled: false
  dsl:
    worker:
      enabled: false
    source-dir: dsl-examples

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
  flyway:
      enabled: false
  main:
    # Allow test slices that scan the starter package to override mock beans declared by other
    # test slices. Several @SpringBootTest classes (e.g. SecurityConfigurationTest,
    # ProductionSecurityProfileTest) each provide their own @Primary JwtDecoder mock; without
    # this flag the second one fails with BeanDefinitionOverrideException. The override is
    # benign — both mocks are equivalent — and only happens inside :starter's test classpath.
    allow-bean-definition-overriding: true

logging:
  pattern:
    level: "%5p [rid=%X{rid:-}, cid=%X{cid:-}]"

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,dslReadiness
  info:
    env:
      enabled: false
    java:
      enabled: true
    git:
      enabled: true
    build:
      enabled: true
