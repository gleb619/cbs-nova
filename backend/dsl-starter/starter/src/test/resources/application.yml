temporal:
  connection-target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}

dsl:
  worker:
    enabled: false

cbs:
  dsl:
    source-dir: dsl-examples

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

logging:
  pattern:
    level: "%5p [rid=%X{rid:-} cid=%X{cid:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: false
    java:
      enabled: true
    git:
      enabled: true
    build:
      enabled: true
