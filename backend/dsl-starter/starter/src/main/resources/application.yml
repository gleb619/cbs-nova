server:
  # Drain in-flight run/preview/explain requests on SIGTERM instead of
  # resetting connections mid-execution (T306). New connections are refused
  # as soon as shutdown starts; active requests get up to
  # spring.lifecycle.timeout-per-shutdown-phase to finish.
  shutdown: graceful

spring:
  lifecycle:
    # Upper bound on each shutdown phase, including the graceful web-server
    # drain. Runs still in flight after this are cut. Keep it below the
    # compose stop_grace_period (see app/compose/app.yml). A preview with no
    # execution timeout (cbs.nova.preview.execution.timeout-ms=0, T298) can
    # hold shutdown open for the full window — leave the preview timeout on.
    timeout-per-shutdown-phase: 30s

management:
  info:
    git:
      enabled: true
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dslReadiness

# Expose request-scope MDC keys (rid = X-Request-Id, cid = X-Correlation-Id) on every
# log line. %X{key:-} renders empty for uncorrelated requests (no noisy "null").
logging:
  pattern:
    level: "%5p [rid=%X{rid:-} cid=%X{cid:-}]"

# cbs.runs.retention* — legacy per-job knobs honoured by DslRunRetentionPurger
# (T276) and (when dsl.maintenance.unified.enabled=true) by the unified
# DslMaintenanceService via the run-retention adapter:
#   cbs.runs.retention         Duration finished dsl_runs are kept. 0 disables the purge.
#   cbs.runs.purge-interval    How often the (legacy) purge job runs.
#   cbs.runs.purge-batch-size  Max rows deleted per pass.
# When the master flag dsl.maintenance.unified.enabled is true the legacy
# self-schedule is suppressed and the purge runs on
# dsl.maintenance.schedule.
#
# cbs.runs.reconciliation.* — legacy per-job knobs for DslRunReconciliationService
# (T350 orphan sweep). Honoured identically when the master flag is on
# (rolled into the orphans adapter).

# dsl.maintenance.* — unified retention/GC (T412). Default state is OFF; flip
# dsl.maintenance.unified.enabled=true to fold the per-job purges into one
# scheduled service with shared Micrometer meters (dsl.maintenance.task.duration,
# dsl.maintenance.task.purged, tagged task=<name>).
#
# Cadence: a single schedule drives every registered task; the default is the
# retention purger's existing 1h cadence. Per-task enable flags override the
# master switch on a per-task basis.
#
# dsl.maintenance:
#   unified-enabled: false           # master rollout switch (default false)
#   schedule: 1h                     # default cadence (matches legacy purger)
#   tasks:
#     run-retention:
#       enabled: true                # legacy cbs.runs.retention purge
#     orphans:
#       enabled: true                # legacy cbs.runs.reconciliation.* sweep
#     audit-retention:
#       enabled: true                # forward-compat stub — no-op for now
#
# When dsl.maintenance.audit-retention.* keys are set they are accepted but
# do nothing until T383-derived retention ships.
#
# cbs.dsl.auth.enabled=true activates the X-Api-Key guard registered by
# ApiKeyAuthFilterConfiguration. The starter ships this OFF; flipping it on also requires
# either a stored key (issued via POST /api/dsl/auth/keys) or the legacy bootstrap property
# cbs.dsl.auth.api-key. A non-blank api-key with enabled=false triggers
# ApiKeyAuthMisconfigurationWarning at boot.
#
# cbs.dsl.auth.api-key — BOOTSTRAP/LEGACY. This single-key property is kept for back-compat
# (T410); once any key is issued via the admin endpoints the recommended path is to revoke
# this property and rely on the stored-key table exclusively. The filter logs a one-time
# deprecation hint the first time this property authenticates a request.
#
# Rotatable keys (T410):
#   GET    /api/dsl/auth/keys        list stored keys (label, prefix, timestamps; no hashes/plaintext)
#   POST   /api/dsl/auth/keys        body {"label":"..."} -> returns {id,label,prefix,key} (plaintext ONCE)
#   DELETE /api/dsl/auth/keys/{id}   revoke (404 on unknown id; 204 on success)
#
# cbs.dsl.auth.rbac.enabled=true activates RbacAuthorizationFilter (T408 phase 1) — a per-route
# role enforcement filter on /api/**. Default OFF: zero behaviour change. Roles for OIDC
# principals are read from cbs.dsl.auth.rbac.claim (default "roles"; "scope"/"scp" are also
# honoured when this is the default). API-key principals always resolve to ADMIN. When RBAC is
# on, the admin endpoints above require OPERATOR.
#
# Example wiring for OIDC + RBAC:
#   cbs.dsl.auth.rbac.enabled: true
#   cbs.dsl.auth.rbac.claim: roles
#   cbs.security.oidc.enabled: true
#   spring.security.oauth2.resourceserver.jwt.issuer-uri: https://idp.example/realms/cbs-nova

# cbs.dsl.auth.* — DSL REST-API authentication & authorization (T408, T410)

cbs:
  nova:
    explain:
      budget-chars: 4000
      name-max-tokens: 128
      description-max-tokens: 256
      mermaid-max-tokens: 4096

# cbs.dsl.helper.* — DSL helper tunables (T494)
cbs:
  dsl:
    helper:
      json-patch:
        pretty-print: false
      jwt:
        default-algorithm: HS256
        default-ttl-seconds: 3600

    # Piece-manifest loader (T548). Enabled by default; if the configured path is missing the
    # service starts with an empty snapshot so existing deployments are unaffected.
    manifest:
      enabled: true
      path: classpath:piece-manifest.yaml
      # Pre-check enforcement knobs (T549), used by PieceGuardFilter on manifest api-target
      # routes only. Routes absent from the manifest are unaffected.
      # flags.<name> — boolean feature flags referenced by preCheck: feature-flag. Absent or
      # false means disabled (fail-closed).
      # flags:
      #   workbench-publish: true
      # rate-classes.<name> — token buckets for preCheck: rate-class, owned per
      # principal+piece by the guard (independent of cbs.security.ratelimit.*, which keeps its
      # global per-client-IP buckets). A manifest rate class with no config here fails closed.
      # rate-classes:
      #   control-plane:
      #     capacity: 20
      #     refill-per-second: 5.0
      # Post-check hook pipeline (T550). Hooks run async on a dedicated named-thread pool
      # after a guarded piece executes successfully (never on the request thread).
      post-check:
        executor-pool-size: 2
        # block-next-execution blocks: how long a raised block denies the piece, and whether
        # it applies to everyone (piece) or only the principal that tripped it (principal).
        # Blocks are in-memory (single instance), auto-expire after the TTL, and clear on
        # manifest reload or restart.
        block-ttl: 30m
        block-scope: piece
      # Object-level capability enforcement (T552).
      # Master feature flag — ships OFF by default. When false the guard is a no-op.
      object-enforcement:
        enabled: false
      # Production default policy for unlisted helpers/processes/functions: permissive
      # allows and audits; strict denies-by-default. Preview is always deny-by-default.
      object-mode: permissive

# DSL builder HTTP client resilience (T498).
# Wired from csb.dsl.builder-client.* (namespace preserved for backwards compatibility).
# The circuit breaker, bulkhead and request queue are Resilience4j core primitives.
# Note: the request queue's offerTimeoutMillis is kept for backwards compatibility but is
# ignored — ThreadPoolBulkhead rejects immediately when its bounded queue is full.
csb:
  dsl:
    builder-client:
      enabled: true
      base-url: http://localhost:8091
      http2: true
      queue:
        capacity: 100
        offer-timeout-millis: 5000
        workers: 4
      bulkhead:
        permits: 8
        acquire-timeout-seconds: 5
      breaker:
        failure-threshold: 5
        open-duration-seconds: 30
        half-open-probes: 3
      timeouts:
        connect-millis: 5000
        read-millis: 60000

# cbs.nova.dry-run.* — log capture for preview/explain runs.
cbs:
  nova:
    dry-run:
      # How the current run id is propagated to the logback appender:
      #   mdc       — via the org.slf4j.MDC key used by MdcDryRunLoggingContext (default)
      #   threadlocal — via ThreadLocalDryRunLoggingContext
      context:
        type: mdc
      log:
        # Maximum log events retained per preview/explain run. Once the bound is reached the
        # oldest events are evicted; this cap prevents an unbounded buffer if a run logs heavily.
        max-events-per-run: 1000

# cbs.nova.schedule.* — Temporal schedules created via the DSL schedule API
# (DslScheduleService).
# cbs.nova.tracing.* — OpenTelemetry identity and OTLP export.
cbs:
  nova:
    schedule:
      # How long after a missed fire Temporal still catches it up. Fires missed beyond this
      # window (e.g. during a Temporal outage longer than 1 minute) are silently dropped —
      # they do not backfill when Temporal recovers. Default 1m.
      catchup-window: 1m
    tracing:
      # service.name attached to every exported span.
      service-name: cbs-nova
      otlp:
        # OTLP HTTP trace endpoint (e.g. http://localhost:4318/v1/traces). Leave blank to fall
        # back to the OTEL_EXPORTER_OTLP_ENDPOINT environment variable; if neither is set,
        # tracing is disabled and a noop OpenTelemetry instance is used.
        endpoint:

# cbs.vhs.scrub.* — record-time scrubbing of VHS tape events (T556). Master switch is OFF by
# default (scrub.enabled=false), which makes the redactor a reference-equality no-op with zero
# overhead on the recorder hot path. Enable it and list ordered rules (first match wins); each rule
# selects a JSON path inside an event's input/output/metadata tree (dot notation + [*] for array
# elements) and applies one action (remove | mask | fake). Missing paths are skipped silently with a
# single bounded WARN per path. The seed keeps {original, seed, field} -> same fake for reproducible
# replay correlation.
#
# cbs:
#   vhs:
#     scrub:
#       enabled: false                 # master switch; default false
#       mask-value: "***REDACTED***"   # value used by action: mask; default ***REDACTED***
#       seed: "dev-replay-seed-01"     # optional; absent -> random per-tape seed
#       rules:
#         - { path: "$.cardNumber",        action: "mask",   pieceId: "mask-sensitive-data" }
#         - { path: "$.accounts[*].iban",  action: "fake",   pieceId: "mask-sensitive-data" }
#         - { path: "$.metadata.authorization", action: "remove", pieceId: "mask-sensitive-data" }
