plugins {
  id 'java-library'
  id 'maven-publish'
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dm)
  alias(libs.plugins.git.properties)
  alias(libs.plugins.test.logger)
}

bootJar {
  enabled = false
}

jar {
  enabled = true
}

springBoot {
  buildInfo()
}

gitProperties {
  dotGitDirectory = file("${rootDir}/../../.git")
}

dependencies {
  api "cbs.nova:dsl-api:${project.version}"
  api "cbs.nova:dsl:${project.version}"
  api "cbs.nova:misc-codegen:${project.version}"

  api libs.avaje.jsonb
  annotationProcessor libs.avaje.jsonb.generator

  implementation libs.mapstruct
  annotationProcessor libs.mapstruct.processor

  compileOnly libs.lombok
  annotationProcessor libs.lombok

  compileOnly libs.bundles.spring.web
  compileOnly libs.spring.boot.starter.actuator
  compileOnly libs.springdoc.openapi.starter.webmvc.ui
  compileOnly libs.openfeign.core
  compileOnly libs.spring.kafka
  implementation libs.spring.boot.starter.data.jdbc
  implementation libs.jackson.databind
  implementation libs.mvel2

  implementation libs.flyway.core
  runtimeOnly libs.postgresql

  api libs.temporal.sdk
  api libs.sentry.spring.boot.jakarta

  implementation libs.opentelemetry.api

  annotationProcessor "cbs.nova:misc-codegen:${project.version}"
  integrationTestAnnotationProcessor "cbs.nova:misc-codegen:${project.version}"

  testAnnotationProcessor "cbs.nova:dsl-codegen:${project.version}"
  integrationTestAnnotationProcessor "cbs.nova:dsl-codegen:${project.version}"
  testImplementation project(':dsl-examples')

  testImplementation libs.springdoc.openapi.starter.webmvc.ui
  testImplementation libs.spring.boot.starter.actuator
  testImplementation libs.bundles.spring.web
  testImplementation libs.bundles.spring.test
  testImplementation libs.temporal.testing
  testImplementation libs.openfeign.core
  testImplementation libs.testcontainers.core
  testImplementation libs.testcontainers.junit.jupiter
  testImplementation libs.testcontainers.postgresql
  testImplementation libs.keycloak.admin.client
  testImplementation libs.h2
  testImplementation libs.rest.assured
  testImplementation libs.awaitility
  testImplementation libs.spring.jdbc
  testImplementation libs.wiremock
  testImplementation libs.spring.kafka
}

processIntegrationTestResources {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
