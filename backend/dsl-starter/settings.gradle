pluginManagement {
  apply from: new File(settingsDir, '../gradle/worktree-version.gradle')
  repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
  }
  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == 'cbs.nova.dsl') {
        useModule("cbs.nova:dsl-gradle-plugin:${cbsNovaVersion}")
      }
    }
  }
}

rootProject.name = 'cbs-nova-dsl-starter'

include 'dsl-examples'
include 'starter'
include 'starter-launcher'

dependencyResolutionManagement {
  versionCatalogs {
    create('libs') {
      from(files('../gradle/libs.versions.toml'))
    }
  }
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    mavenLocal()
    mavenCentral()
  }
}
