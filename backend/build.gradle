plugins {
  id 'base'
}

group = 'cbs.nova'
version = property('version') as String

// Delegate to the three independent Gradle builds. Ordering matters because groups
// are connected through Maven Local: platform -> plugins -> starter.

tasks.register('platformPublishToMavenLocal', Exec) {
  group = 'build'
  description = 'Publish DSL platform artifacts (dsl-api, dsl, dsl-codegen, misc-codegen) to Maven Local'
  workingDir = file('dsl-platform')
  commandLine = ['../gradlew', "-Pversion=${version}", 'publishToMavenLocal']
  outputs.upToDateWhen { false }
}

tasks.register('pluginsPublishToMavenLocal', Exec) {
  group = 'build'
  description = 'Publish DSL plugin artifacts (dsl-gradle-plugin, dsl-idea-plugin) to Maven Local'
  dependsOn 'platformPublishToMavenLocal'
  workingDir = file('dsl-plugins')
  commandLine = ['../gradlew', "-Pversion=${version}", 'publishToMavenLocal']
  outputs.upToDateWhen { false }
}

tasks.register('starterPublishToMavenLocal', Exec) {
  group = 'build'
  description = 'Publish starter + examples artifacts to Maven Local'
  dependsOn 'pluginsPublishToMavenLocal'
  workingDir = file('dsl-starter')
  commandLine = ['../gradlew', "-Pversion=${version}", 'publishToMavenLocal', '-x', 'test']
  outputs.upToDateWhen { false }
}

tasks.register('publishToMavenLocal', Exec) {
  group = 'publishing'
  description = 'Publish all backend groups to Maven Local in the correct order'
  dependsOn 'platformPublishToMavenLocal', 'pluginsPublishToMavenLocal', 'starterPublishToMavenLocal'
  commandLine = ['echo', "All groups published to Maven Local as ${version}"]
}

// Build

tasks.register('platformBuild', Exec) {
  group = 'build'
  description = 'Build the DSL platform group'
  workingDir = file('dsl-platform')
  commandLine = ['../gradlew', "-Pversion=${version}", 'build']
  outputs.upToDateWhen { false }
}

tasks.register('pluginsBuild', Exec) {
  group = 'build'
  description = 'Build the DSL plugins group'
  dependsOn 'platformPublishToMavenLocal'
  workingDir = file('dsl-plugins')
  commandLine = ['../gradlew', "-Pversion=${version}", 'build']
  outputs.upToDateWhen { false }
}

tasks.register('starterBuild', Exec) {
  group = 'build'
  description = 'Build the starter + examples group (excluding tests)'
  dependsOn 'pluginsPublishToMavenLocal'
  workingDir = file('dsl-starter')
  commandLine = ['../gradlew', "-Pversion=${version}", 'build', '-x', 'test']
  outputs.upToDateWhen { false }
}

// The `base` plugin already provides `build`; augment it to depend on the three group builds.
tasks.named('build') {
  dependsOn 'platformBuild', 'pluginsBuild', 'starterBuild'
}
