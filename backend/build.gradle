plugins {
  id 'idea'
  alias(libs.plugins.spotless) apply false
  alias(libs.plugins.test.logger) apply false
}

allprojects {
  group = 'cbs.nova'
  version = '0.0.1-SNAPSHOT'

  repositories {
    mavenLocal()
    mavenCentral()
  }

  configurations.all {
    resolutionStrategy {
      dependencySubstitution {
        substitute(module('cbs.nova:dsl-codegen')).using(project(':dsl-codegen'))
        substitute(module('cbs.nova:dsl')).using(project(':dsl'))
        substitute(module('cbs.nova:dsl-api')).using(project(':dsl-api'))
        substitute(module('cbs.nova:dsl-model')).using(project(':dsl-model'))
        substitute(module('cbs.nova:starter')).using(project(':starter'))
        substitute(module('cbs.nova:dsl-gradle-plugin')).using(project(':dsl-gradle-plugin'))
      }
    }
  }
}

subprojects {
  apply plugin: 'maven-publish'
  apply from: "${rootDir}/gradle/java.gradle"
  apply from: "${rootDir}/gradle/test.gradle"
  apply from: "${rootDir}/gradle/code-style.gradle"

  afterEvaluate {
    if (plugins.hasPlugin(JavaPlugin) && !plugins.hasPlugin('java-gradle-plugin')) {
      publishing {
        publications {
          mavenJava(MavenPublication) {
            from components.java
          }
        }
      }
    }
  }
}

subprojects {
  plugins.withType(JavaPlugin).configureEach {
    dependencies {
      compileOnly libs.lombok
      annotationProcessor libs.lombok

      testCompileOnly libs.lombok
      testAnnotationProcessor libs.lombok
    }
  }
}

idea {
  module {
    name = 'cbs-nova-backend'
  }
}
