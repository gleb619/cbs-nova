rootProject.name = 'cbs-nova-dsl-platform'

include 'dsl-api'
include 'dsl'
include 'dsl-codegen'
include 'misc-codegen'

dependencyResolutionManagement {
  versionCatalogs {
    create('libs') {
      from(files('../gradle/libs.versions.toml'))
    }
  }
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    mavenLocal()
    mavenCentral()
  }
}
