plugins {
  id 'java-library'
  alias(libs.plugins.test.logger)
}

// Stamp the DSL platform version into the codegen provenance resource so generated
// sources can record which platform version produced them.
def dslPlatformVersion = project.version
processResources {
  filesMatching('cbs-nova-dsl-codegen.properties') {
    expand(dslPlatformVersion: dslPlatformVersion)
  }
}

dependencies {
  implementation project(":dsl-api")
  implementation project(':dsl')
  implementation libs.slf4j.api
  runtimeOnly libs.slf4j.simple
  implementation libs.javaparser
  implementation libs.orgjson

  annotationProcessor libs.avaje.jsonb.generator
  runtimeOnly libs.avaje.jsonb.generator

  testImplementation platform(libs.junit.bom)
  testImplementation libs.junit.jupiter
  testImplementation libs.assertj
  testRuntimeOnly libs.junit.platform.launcher
}
