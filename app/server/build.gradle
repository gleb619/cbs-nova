plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dm)
}

apply from: "${rootDir}/../../backend/gradle/worktree-version.gradle"

group = 'cbs.nova'
version = cbsNovaVersion

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation libs.cbs.nova.starter
    implementation libs.cbs.nova.app.dsl

    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    runtimeOnly libs.h2

    testImplementation libs.spring.boot.starter.test
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'cbs.nova') {
            details.useVersion cbsNovaVersion
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
