# Temporal workflow orchestration domain.
# Uses the shared Postgres instance (see postgres.yml) for storage.

services:
  temporal:
    image: temporalio/auto-setup:1.29.7
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    healthcheck:
      # TCP probe on the gRPC port: the auto-setup image strips curl/wget/nc
      # for size, but bash with /dev/tcp is available. auto-setup runs
      # schema migrations + server start on first boot, hence a generous
      # start_period and a lenient retry budget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.52.0
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: "7233"
    depends_on:
      temporal:
        condition: service_healthy