# CBS Nova Spring Boot application domain
services:
  spring-app:
    image: cbs-nova:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TEMPORAL_ADDRESS: temporal:7233
      SENTRY_DSN: "${BUGSINK_DSN:-}"
      KEYCLOAK_URL: "${KEYCLOAK_URL:-}"
      # Observability wiring (Spring Boot 3.x / Micrometer OTLP)
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      MANAGEMENT_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING:-1.0}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "${MANAGEMENT_ENDPOINTS:-health,info,prometheus}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-cbs-nova}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}"
    healthcheck:
      # The runtime image (eclipse-temurin:25-jre-jammy) does not ship
      # curl or wget, and we want to keep the Dockerfile minimal. Bash is
      # available, so we open a TCP connection to the actuator port (8090)
      # via /dev/tcp. Spring Boot only binds the listener once the embedded
      # server is fully up, so this is a meaningful readiness gate without
      # the cost of installing an HTTP client. start_period is tuned to
      # allow for JVM warm-up, Temporal worker registration and any
      # first-boot migrations.
      # NB: this is a TCP-only probe; it stays UP even when Temporal is
      # unreachable. Set cbs.health.temporal.fail-status=down on the app
      # to make /actuator/health (and therefore this gate) report DOWN when
      # Temporal is down. See docs/dsl/runtime.md#temporal-health-gating.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      temporal:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      bugsink:
        condition: service_healthy
