# CBS Nova Spring Boot application domain
services:
  spring-app:
    image: cbs-nova:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TEMPORAL_ADDRESS: temporal:7233
      SENTRY_DSN: "${BUGSINK_DSN:-}"
      KEYCLOAK_URL: "${KEYCLOAK_URL:-}"
      # Observability wiring (Spring Boot 3.x / Micrometer OTLP)
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      MANAGEMENT_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING:-1.0}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "${MANAGEMENT_ENDPOINTS:-health,info,prometheus}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-cbs-nova}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}"
    depends_on:
      - bugsink
      - keycloak
      - temporal
