# Alertmanager routing for local development.
# In production replace the null receiver with a real webhook / Slack / PagerDuty route.
route:
  receiver: 'null'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  # Swallows alerts: they stay visible at :9093 (UI + /api/v2/alerts) but nothing is delivered.
  - name: 'null'

