# Git hosting / code collaboration domain.
# Uses the shared Postgres instance (see postgres.yml) for storage.

services:
  gitea:
    image: gitea/gitea:1.23.5
    restart: unless-stopped
    ports:
      - "3001:3000"     # Web UI
      - "2222:22"       # SSH
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3001/}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-localhost}
      GITEA__server__SSH_PORT: 2222
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "${GITEA_DISABLE_REGISTRATION:-false}"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "${GITEA_REQUIRE_SIGNIN_VIEW:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - gitea-data:/data

volumes:
  gitea-data: