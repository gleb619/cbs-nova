# Authentication & IAM domain.
# Uses the shared Postgres instance (see postgres.yml) for storage.
#
# --- OIDC resource-server integration (T275) ---
# The Spring Boot starter can opt in to JWT-based auth via:
#     cbs.security.oidc.enabled=true
#     spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/cbs-nova
# When OIDC is enabled (default: OFF, fully anonymous), `/api/dsl/**` and
# `/api/executions/**` require a Bearer JWT; actuator health and OpenAPI stay
# permitAll. The Keycloak realm and client are NOT yet bootstrapped here —
# `realm/client TBD`. To enable end-to-end, create a `cbs-nova` realm in this
# Keycloak instance and a confidential client that the BFF / curl can use to
# obtain a Bearer token. See backend/dsl-starter/starter/src/main/java/cbs/nova/
# starter/config/SecurityConfiguration.java for the protected path list.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    healthcheck:
      # The Keycloak image does not ship curl/wget/nc, but bash + /dev/tcp
      # is available. We probe TCP on the main HTTP port (8080) rather than
      # the management port (9000), because 9000 is not exposed to the
      # spring-app container and we don't want to widen the Keycloak surface
      # area just for a healthcheck. This proves the HTTP listener is up;
      # full readiness (DB-backed realm import) is best-effort within the
      # retries window below.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      # Keycloak 22 with Postgres backend does realm import + DB schema
      # setup on first boot; subsequent boots are faster but still slow.
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data: