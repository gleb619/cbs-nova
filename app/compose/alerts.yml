# Prometheus alert rules for cbs-nova.
# Loaded by app/compose/prometheus.yml.

groups:
  # T402 threshold alerts. NOTE (T490): the SLO burn-rate alerts in cbs-nova-slo-burn-rate
  # supersede CbsNovaRunErrorRate once burn rates are tuned against real traffic — do not
  # delete this group yet, it stays as the coarser safety net.
  - name: cbs-nova-run-errors
    rules:
      # VERIFY series name against a booted app: curl -s :8090/actuator/prometheus | grep dsl_run
      - alert: CbsNovaRunErrorRate
        expr: |
          sum(rate(dsl_run_count_total{status!~"SUCCESS"}[5m]))
          /
          sum(rate(dsl_run_count_total[5m])) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "cbs-nova DSL run error rate is high"
          description: "More than 10% of DSL runs are finishing with a non-SUCCESS status over the last 5 minutes, sustained for 10 minutes."

  - name: cbs-nova-preview-latency
    rules:
      # T720: dsl.preview.duration now publishes percentile histograms (see MetricsStage), so the
      # _bucket series exist and this alert is a true histogram_quantile p95. Target = p95 ≤ 2s
      # (SLO 3, docs/slo.md); threshold is a starting value — revisit after 28d of real data.
      - alert: CbsNovaPreviewLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(dsl_preview_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "cbs-nova DSL preview p95 latency is high"
          description: "The 95th percentile DSL preview duration exceeded 2 seconds for 10 minutes. Target is a starting value — revisit against 28 days of real baseline data."

  - name: cbs-nova-preview-outcome
    rules:
      # VERIFY series name against a booted app: curl -s :8090/actuator/prometheus | grep dsl_preview_outcome
      - alert: CbsNovaPreviewErrorRate
        expr: |
          sum(rate(dsl_preview_outcome_total{outcome=~"error|timeout"}[5m]))
          /
          sum(rate(dsl_preview_outcome_total[5m])) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "cbs-nova DSL preview error rate is high"
          description: "More than 10% of DSL previews finished with error or timeout over the last 5 minutes, sustained for 10 minutes."

  - name: cbs-nova-app-down
    rules:
      # Temporal-specific reachability alerting rides on T390 readiness work (future dsl_temporal_reachable gauge).
      - alert: CbsNovaAppDown
        expr: up{job="cbs-nova"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "cbs-nova application is down"
          description: "Prometheus cannot scrape the cbs-nova job at spring-app:8090/actuator/prometheus for 2 minutes."

  # T490 — multi-window multi-burn-rate alerts for the run-success SLO.
  # Budget/target reference: docs/slo.md (SLO 1). Target = 99.0% placeholder
  # (<!-- TEAM: confirm target -->), so budget = 1 - 0.99 = 0.01 and the numeric literals
  # below (0.144 = 14.4 * 0.01, 0.06 = 6 * 0.01) must be recomputed when the target changes.
  # Success ratio uses terminal statuses only: COMPLETED / (COMPLETED|FAILED|STALE|CANCELLED);
  # the DslRunStatus enum has no SUCCESS label (successful runs are COMPLETED) and RUNNING
  # is excluded. Latency SLOs (run p95, preview p95) have no burn-rate alerts in phase 1 —
  # deferred until percentile histograms are enabled on the timers (T403), see docs/slo.md.
  - name: cbs-nova-slo-burn-rate
    rules:
      # Fast burn (Google SRE workbook): burning 14.4x the 28d error budget, i.e. the whole
      # budget would be gone in ~2 days. Long window confirms sustained burn, short window
      # confirms it is still burning right now. Pages.
      - alert: CbsNovaSloRunSuccessFastBurn
        expr: |
          (
            1 - (
              sum(rate(dsl_run_count_total{status="COMPLETED"}[1h]))
              /
              sum(rate(dsl_run_count_total{status=~"COMPLETED|FAILED|STALE|CANCELLED"}[1h]))
            )
          ) > (14.4 * 0.01)
          and
          (
            1 - (
              sum(rate(dsl_run_count_total{status="COMPLETED"}[5m]))
              /
              sum(rate(dsl_run_count_total{status=~"COMPLETED|FAILED|STALE|CANCELLED"}[5m]))
            )
          ) > (14.4 * 0.01)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "cbs-nova run-success SLO is burning its error budget fast"
          description: "Over the last 1h and 5m, more than 14.4x the 28d error budget of the run-success SLO (target 99.0%, see docs/slo.md) is being burned — the budget would exhaust in ~2 days at this rate. Page the on-call."

      # Slow burn: burning 6x the 28d error budget (budget gone in ~5 days). Opens a ticket,
      # does not page.
      - alert: CbsNovaSloRunSuccessSlowBurn
        expr: |
          (
            1 - (
              sum(rate(dsl_run_count_total{status="COMPLETED"}[6h]))
              /
              sum(rate(dsl_run_count_total{status=~"COMPLETED|FAILED|STALE|CANCELLED"}[6h]))
            )
          ) > (6 * 0.01)
          and
          (
            1 - (
              sum(rate(dsl_run_count_total{status="COMPLETED"}[30m]))
              /
              sum(rate(dsl_run_count_total{status=~"COMPLETED|FAILED|STALE|CANCELLED"}[30m]))
            )
          ) > (6 * 0.01)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "cbs-nova run-success SLO is burning its error budget slowly"
          description: "Over the last 6h and 30m, more than 6x the 28d error budget of the run-success SLO (target 99.0%, see docs/slo.md) is being burned — the budget would exhaust in ~5 days at this rate. Open a reliability ticket; no page."

  # T720 — multi-window burn-rate alerts for latency SLOs.
  #
  # Budget math:
  #   SLO 2 (run duration): p95 ≤ 60 s ⇒ 5% of runs may exceed the target ⇒ error budget = 0.05.
  #   SLO 3 (preview latency): p95 ≤ 2 s ⇒ 5% may exceed the target ⇒ error budget = 0.05.
  #   Fast burn threshold = 14.4 × 0.05 = 0.72.
  #   Slow burn threshold = 6 × 0.05 = 0.30.
  #
  # These are starting values with no observed baseline; re-tune after 28 days of bucket data.
  # The numerator is the share of requests whose duration is within SLO; the complement is the
  # bad-request rate. Both windows must exceed the threshold to avoid single-spike pages.
  - name: cbs-nova-run-duration-slo-burn-rate
    rules:
      - alert: CbsNovaSloRunDurationFastBurn
        expr: |
          (
            1 - (
              sum(rate(dsl_run_duration_seconds_bucket{le="60"}[1h]))
              /
              sum(rate(dsl_run_duration_seconds_bucket{le="+Inf"}[1h]))
            )
          ) > (14.4 * 0.05)
          and
          (
            1 - (
              sum(rate(dsl_run_duration_seconds_bucket{le="60"}[5m]))
              /
              sum(rate(dsl_run_duration_seconds_bucket{le="+Inf"}[5m]))
            )
          ) > (14.4 * 0.05)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "cbs-nova run-duration SLO is burning its error budget fast"
          description: "Over the last 1h and 5m, more than 14.4x the 28d error budget of the run-duration SLO (p95 ≤ 60s, budget 5%, see docs/slo.md SLO 2) is being burned — the budget would exhaust in ~2 days at this rate. Page the on-call."

      - alert: CbsNovaSloRunDurationSlowBurn
        expr: |
          (
            1 - (
              sum(rate(dsl_run_duration_seconds_bucket{le="60"}[6h]))
              /
              sum(rate(dsl_run_duration_seconds_bucket{le="+Inf"}[6h]))
            )
          ) > (6 * 0.05)
          and
          (
            1 - (
              sum(rate(dsl_run_duration_seconds_bucket{le="60"}[30m]))
              /
              sum(rate(dsl_run_duration_seconds_bucket{le="+Inf"}[30m]))
            )
          ) > (6 * 0.05)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "cbs-nova run-duration SLO is burning its error budget slowly"
          description: "Over the last 6h and 30m, more than 6x the 28d error budget of the run-duration SLO (p95 ≤ 60s, budget 5%, see docs/slo.md SLO 2) is being burned — the budget would exhaust in ~5 days at this rate. Open a reliability ticket; no page."

  - name: cbs-nova-preview-latency-slo-burn-rate
    rules:
      - alert: CbsNovaSloPreviewLatencyFastBurn
        expr: |
          (
            1 - (
              sum(rate(dsl_preview_duration_seconds_bucket{le="2"}[1h]))
              /
              sum(rate(dsl_preview_duration_seconds_bucket{le="+Inf"}[1h]))
            )
          ) > (14.4 * 0.05)
          and
          (
            1 - (
              sum(rate(dsl_preview_duration_seconds_bucket{le="2"}[5m]))
              /
              sum(rate(dsl_preview_duration_seconds_bucket{le="+Inf"}[5m]))
            )
          ) > (14.4 * 0.05)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "cbs-nova preview-latency SLO is burning its error budget fast"
          description: "Over the last 1h and 5m, more than 14.4x the 28d error budget of the preview-latency SLO (p95 ≤ 2s, budget 5%, see docs/slo.md SLO 3) is being burned — the budget would exhaust in ~2 days at this rate. Page the on-call."

      - alert: CbsNovaSloPreviewLatencySlowBurn
        expr: |
          (
            1 - (
              sum(rate(dsl_preview_duration_seconds_bucket{le="2"}[6h]))
              /
              sum(rate(dsl_preview_duration_seconds_bucket{le="+Inf"}[6h]))
            )
          ) > (6 * 0.05)
          and
          (
            1 - (
              sum(rate(dsl_preview_duration_seconds_bucket{le="2"}[30m]))
              /
              sum(rate(dsl_preview_duration_seconds_bucket{le="+Inf"}[30m]))
            )
          ) > (6 * 0.05)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "cbs-nova preview-latency SLO is burning its error budget slowly"
          description: "Over the last 6h and 30m, more than 6x the 28d error budget of the preview-latency SLO (p95 ≤ 2s, budget 5%, see docs/slo.md SLO 3) is being burned — the budget would exhaust in ~5 days at this rate. Open a reliability ticket; no page."
  # T714 — authoring-health alert group.
  #
  # Pre-check (T708 lesson: dsl_change_request, dsl_definition_tests, dsl_compile_diagnostics are
  # JDBC/database tables in this codebase, not Micrometer metrics). Verified by grepping
  # backend/dsl-starter/starter/src/main for Counter.builder/Timer.builder/Gauge.builder and
  # meterRegistry.counter/timer/gauge registrations referencing compile/diagnostic/definition/test
  # meter names: NONE exist. The only authoring-adjacent meters in scope are piece-related
  # (dsl.piece.postcheck.total/failed, dsl.piece.object.denied) and none of them is a compile-
  # diagnostics error-volume or definition-test failure rate.
  #
  # Therefore no alert exprs are emitted in this group — PromQL against non-existent series would
  # be inert rules (always "no data") and worse than no rule, because a green board would mask
  # the absence of real telemetry. The group is kept as the documented home for future authoring
  # alerts once meters are introduced (T714 follow-up: register dsl.compile.diagnostics and
  # dsl.definition.test counters in the compile pipeline / definition-test runner, then add
  # alert exprs here under the conventions of cbs-nova-run-errors).
  #
  # Skip-by-design:
  # - dsl_piece_object_denied (OBJECT_GUARD_DENIED_COUNTER = "dsl.piece.object.denied"):
  #   ManifestObjectGuard ships default-off (cbs.dsl.manifest.object-enforcement.enabled=false,
  #   see ManifestObjectGuardConfiguration javadoc). With the guard inert the counter never
  #   increments — alerting would be permanently firing-or-noisy depending on how the rule
  #   handles absent series. No rule until the flag is enabled by default (T549 follow-up).
  # - change-request stall: dsl_change_request is a JDBC table with no `updated_at` or last-
  #   activity timestamp exposed as a Micrometer gauge. Stuck-state semantics ("no transitions
  #   in N minutes") need either a synthetic gauge or a custom collector; out of scope for
  #   this rule file. Tracked separately.
  - name: cbs-nova-authoring-health
    rules: []
