# Grafana datasource provisioning (apiVersion 1).
# Mounted read-only at /etc/grafana/provisioning by observability.yml.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: cbs-nova-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: cbs-nova-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Jaeger
    uid: cbs-nova-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
