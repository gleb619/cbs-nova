# Dashboard file provider: loads every JSON file from /var/lib/grafana/dashboards
# (mounted read-only from app/compose/grafana/dashboards by observability.yml).
apiVersion: 1

providers:
  - name: cbs-nova
    orgId: 1
    folder: CBS Nova
    type: file
    disableDeletion: false
    allowUiUpdates: true
    foldersFromFilesStructure: false
    options:
      path: /var/lib/grafana/dashboards
