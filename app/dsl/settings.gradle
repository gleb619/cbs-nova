pluginManagement {
  apply from: new File(settingsDir, '../../backend/gradle/worktree-version.gradle')
  repositories {
    mavenLocal()
    gradlePluginPortal()
    mavenCentral()
  }
  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == 'cbs.nova.dsl') {
        useModule("cbs.nova:dsl-gradle-plugin:${cbsNovaVersion}")
      }
    }
  }
}

rootProject.name = 'app-dsl'
