pieces:
  - id: dsl-reload
    target:
      type: api
      route: POST /api/dsl/reload
    preCheck:
      - type: role
        anyOf: [author, operator, admin]
      - type: rate-class
        class: control-plane
    postCheck:
      - type: audit-write
        action: DEFINITION_RELOAD
      - type: notify
        channel: workbench
    failMode: deny

  - id: execution-cancel
    target:
      type: api
      route: POST /api/executions/*/cancel
    preCheck:
      - type: role
        anyOf: [runner, admin]
      - type: rate-class
        class: run-mutations
    postCheck:
      - type: audit-write
        action: RUN_CANCEL
    failMode: deny

  - id: workbench-publish
    target:
      type: button
      uiKey: workbench-publish-btn
    preCheck:
      - type: role
        anyOf: [author, admin]
      - type: feature-flag
        flag: workbench-publish
    postCheck:
      - type: notify
        channel: workbench
    failMode: deny

  - id: workbench-approve
    target:
      type: button
      uiKey: workbench-approve-btn
    preCheck:
      - type: role
        anyOf: [author, operator, admin]
    failMode: deny

  - id: preview-sandbox-helper
    target:
      type: object
      objectType: helper
      objectName: PreviewSandbox
    preCheck:
      - type: role
        anyOf: [runner, author, admin]
    postCheck:
      - type: invariant-assert
        description: preview helper returned only sandbox-safe types
    failMode: audit-only

  - id: vhs-tape-delete
    target:
      type: api
      route: DELETE /api/v1/vhs/tapes/{runId}
    preCheck:
      - type: role
        anyOf: [operator, admin]
      - type: rate-class
        class: control-plane
    postCheck:
      - type: audit-write
        action: VHS_TAPE_DELETE
    failMode: deny

  - id: vhs-tape-replay
    target:
      type: api
      route: POST /api/v1/vhs/tapes/{runId}/replay
    preCheck:
      - type: role
        anyOf: [operator, admin]
      - type: rate-class
        class: run-mutations
    postCheck:
      - type: audit-write
        action: VHS_TAPE_REPLAY
    failMode: deny
  - id: dsl-signal-send
    target:
      type: api
      route: POST /api/dsl/signals/{runId}
    preCheck:
      - type: role
        anyOf: [runner, admin]
      - type: rate-class
        class: run-mutations
    postCheck:
      - type: audit-write
        action: SIGNAL_SENT
    failMode: deny
