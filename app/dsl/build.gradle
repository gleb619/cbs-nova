plugins {
  id 'java'
  id 'maven-publish'
  alias(libs.plugins.cbs.nova.dsl)
}

apply from: "${rootDir}/../../backend/gradle/worktree-version.gradle"

group = 'cbs.nova'
version = cbsNovaVersion

repositories {
  mavenLocal()
  mavenCentral()
}

dependencies {
  implementation libs.cbs.nova.dsl.api
  implementation libs.cbs.nova.dsl.runtime
  implementation libs.temporal.sdk
  implementation libs.avaje.jsonb
  annotationProcessor libs.avaje.jsonb.generator

  testImplementation libs.junit.jupiter
  testImplementation libs.assertj
  testRuntimeOnly libs.junit.platform.launcher
}

configurations.all {
  resolutionStrategy.eachDependency { details ->
    if (details.requested.group == 'cbs.nova') {
      details.useVersion cbsNovaVersion
    }
  }
}

dslCompile {
  dslPackage = 'cbs.nova.app.dsl'
  runtimeModule = ''
  buildVersion = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
  }.standardOutput.asText.get().trim()
  logLevel = 'INFO'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

tasks.named('test') {
  useJUnitPlatform()
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }
  repositories {
    mavenLocal()
  }
}

tasks.named('compileTestJava') {
  dependsOn 'copyGeneratedClasses'
}
