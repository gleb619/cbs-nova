version: '3.8'

services:
  postgres-keycloak:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres-keycloak
    volumes:
      - keycloak-data:/opt/keycloak/data

  bugsink-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugsinkuser
      POSTGRES_PASSWORD: change_me_secure_password
      POSTGRES_DB: bugsink
    volumes:
      - postgres-bugsink-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsinkuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  bugsink:
    image: bugsink/bugsink:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      bugsink-db:
        condition: service_healthy
    environment:
      SECRET_KEY: your_super_secret_key_at_least_50_chars_long
      CREATE_SUPERUSER: admin:admin
      DATABASE_URL: postgresql://bugsinkuser:change_me_secure_password@bugsink-db:5432/bugsink
      BEHIND_HTTPS_PROXY: "false"
      PORT: 8000

  spring-app:
    image: cbs-nova:latest
    ports:
      - "8090:8090"
    environment:
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SPRING_PROFILES_ACTIVE: prod
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - bugsink
      - temporal

  temporal:
    image: temporalio/auto-setup:1.29.7
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    depends_on:
      - temporal-postgres

  temporal-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal-ui:
    image: temporalio/ui:2.52.0
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: "7233"
    depends_on:
      - temporal

volumes:
  postgres-keycloak-data:
  keycloak-data:
  postgres-bugsink-data:
  temporal-postgres-data: