name: CI

on:
  push:
  pull_request:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so the kanban guard can resolve the PR base / push-before ref.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Kanban append-only guard
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/cbs_cli.py lint-kanban --base "$BASE"

      # backend/ has no settings.gradle — builds are 3 separate Gradle projects
      # (dsl-platform, dsl-plugins, dsl-starter). Root backend/gradlew is Gradle
      # 8.13 and fails under Java 25; use backend/dsl-platform/gradlew (9.4.1).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Platform tests
        run: backend/dsl-platform/gradlew -p backend/dsl-platform test --no-daemon

      # dsl-starter resolves cbs.nova:* deps from Maven Local — publish first.
      - name: Publish platform to Maven Local
        run: backend/dsl-platform/gradlew -p backend/dsl-platform publishToMavenLocal -x test --no-daemon

      - name: Starter tests
        run: backend/dsl-platform/gradlew -p backend/dsl-starter :starter:test --no-daemon

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: backend/**/build/reports/tests/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No explicit version — pnpm/action-setup reads the packageManager field
      # (pnpm@9.0.0) from frontend/package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Check generated API types are up to date
        working-directory: frontend
        run: pnpm check:api-types

      # T561: regenerate the OpenAPI-derived BFF proxy stubs, then verify they
      # match docs/openapi.json and that the hand-written custom routes are intact.
      - name: Generate BFF routes
        working-directory: frontend
        run: pnpm gen:bff-routes

      - name: Check BFF routes are up to date
        working-directory: frontend
        run: pnpm check:bff-routes

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  # T609: the operator-portal host app (@cbs/operator-portal) consumes
  # @cbs/admin-ui-plugin via pnpm pack:local — the closest thing to a
  # consumer contract test for the plugin. Catches plugin API regressions
  # the in-tree frontend job can't see. Own job: the pack step is slow.
  operator-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same pnpm/node setup as build-frontend — action-setup reads
      # packageManager (pnpm@9.0.0) from frontend/package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            app/ui/pnpm-lock.yaml

      - name: Install frontend workspace deps
        working-directory: frontend
        run: pnpm install

      # gen:bff-routes writes server/api/v1/** routes which are gitignored;
      # pack:local's build:server step transpiles them into the tarball.
      - name: Generate BFF routes
        working-directory: frontend
        run: pnpm gen:bff-routes

      - name: Pack plugin + components into local registry
        working-directory: app/ui
        run: pnpm pack:local

      # pack:local rewrites app/ui/package.json file: refs; re-install to
      # resolve the freshly packed tarballs. --force re-extracts them: pnpm
      # otherwise keeps the previous same-version file: extraction, even
      # though the tarball contents changed. CI runners are ephemeral, so
      # the mutated package.json never leaks into a cache.
      - name: Install operator-portal dependencies
        working-directory: app/ui
        run: pnpm install --force

      - name: Test operator-portal
        working-directory: app/ui
        run: pnpm test

      - name: Build operator-portal
        working-directory: app/ui
        run: pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # make lint runs backend Spotless via backend/dsl-platform/gradlew, which
      # requires Java 25 and benefits from Gradle caching.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # No explicit version — pnpm/action-setup reads the packageManager field
      # (pnpm@9.0.0) from frontend/package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      # python3 is pre-installed on ubuntu-latest; make lint's kanban step
      # invokes scripts/cbs_cli.py via python3.
      - name: Run make lint
        run: make lint

  dsl-plugins-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # dsl-plugins resolves cbs.nova:* from Maven Local (same as dsl-starter);
      # uses backend/dsl-platform/gradlew since backend/gradlew (8.13) fails
      # under Java 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run dsl-plugins tests
        run: backend/dsl-platform/gradlew -p backend/dsl-plugins test --no-daemon

  scripts-tests:
    # Pure-unit pytest suite for scripts/src/cbs_cli/ (test_classify,
    # test_lint_kanban, test_openapi_diff). No Docker / network — runs entirely
    # off pip + the repo's own fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pytest
        run: pip install pytest

      - name: Run scripts pytest suite
        run: python3 -m pytest scripts/test/ -q

  # T646 — runs the starter integrationTest suite against self-managed
  # Testcontainers (Postgres + Temporal-sqlite-dev + Keycloak). No external
  # services block: starter/src/integrationTest/.../BaseContainers.java spins
  # its own GenericContainer<PostgreSQLContainer> and
  # GenericContainer<temporalio/auto-setup:1.25.2 (sqlite dev mode)>, and
  # starter/src/integrationTest/resources/application.yml only needs the
  # default `TEMPORAL_ADDRESS:127.0.0.1:7233` placeholder (overridden at
  # runtime via @DynamicPropertySource). Adding GHA service containers would
  # be redundant and would not match the testcontainers-managed host/port.
  integration-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Java + Gradle pin as build-backend (Java 25; backend/gradlew 8.13
      # fails under Java 25, so we use the per-build backend/dsl-platform/gradlew
      # which is pinned to 9.4.1).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Starter resolves cbs.nova:* from Maven Local; publish the platform
      # jar first. Same chain as build-backend: dsl-platform test is skipped
      # here because build-backend already covers it and runs earlier in the
      # same workflow run.
      - name: Publish platform to Maven Local
        run: backend/dsl-platform/gradlew -p backend/dsl-platform publishToMavenLocal -x test --no-daemon

      # integrationTest pulls postgres:16, temporalio/auto-setup:1.25.2 and
      # quay.io/keycloak/keycloak:22.0.0 via Testcontainers from Docker Hub.
      # ubuntu-latest runners ship Docker preinstalled; no explicit
      # services: block — adding one would shadow the Testcontainers-managed
      # host/port mapping and break @DynamicPropertySource wiring.
      #
      # No test exclusions: DslExamplesEndToEndTest.securedRestEndpointRunsDslWithKeycloakToken
      # is already @Disabled in-tree (T51 Keycloak resource-server wiring). Any future
      # environment-sensitive exclusion must be listed here with a comment naming why.
      - name: Run starter integrationTest
        run: backend/dsl-platform/gradlew -p backend/dsl-starter :starter:integrationTest --no-daemon

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: backend/**/build/reports/tests/integrationTest/

  secret-scan:
    # Pinned Docker image (zricethezav/gitleaks:v8.24.3) so the scan
    # reproduces bit-for-bit against the exact version we validate
    # locally. No `:latest` — see .gitleaks.toml for the ruleset,
    # which extends the upstream default and whitelists the dummies
    # in three unit-test fixtures (each entry comments the fixture).
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 lets gitleaks scan the full branch history
      # instead of just HEAD; actions/checkout gives it a clean
      # single-ref repo, so git mode "just works" on CI runners.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          -w /repo
          zricethezav/gitleaks:v8.24.3
          detect --source /repo --config /repo/.gitleaks.toml
